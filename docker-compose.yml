services:
  postgres:
    image: postgres:18-alpine
    container_name: navkwabuild-postgres
    environment:
      POSTGRES_DB: navkwabuild
      POSTGRES_USER: navkwabuild
      POSTGRES_PASSWORD: navkwabuild_secret
    ports:
      - "5432:5432"
    volumes:
      - navkwabuild-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navkwabuild -d navkwabuild"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: navkwabuild-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - navkwabuild-redis:/data

volumes:
  navkwabuild-postgres:
  navkwabuild-redis:
