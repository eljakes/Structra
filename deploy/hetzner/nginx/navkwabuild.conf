server {
    listen 80;
    listen [::]:80;
    server_name app.navkwabuild.com;

    root /var/www/navkwabuild/current/frontend/dist;
    index index.html;

    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /favicon.ico {
        try_files /favicon.svg =404;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ^~ /api/ {
        try_files $uri @navkwabuild_laravel;
    }

    location ^~ /storage/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.php {
        return 404;
    }

    location @navkwabuild_laravel {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/navkwabuild/current/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/navkwabuild/current/backend/public;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
